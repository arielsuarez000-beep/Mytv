name: Construir APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir
        run: |
          unzip -q mitv-app.zip
          rm -f mitv/babel.config.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Habilitar Cleartext en app.json
        run: |
          node -e '
            const fs = require("fs");
            const path = "./mitv/app.json";
            if (fs.existsSync(path)) {
              const content = JSON.parse(fs.readFileSync(path, "utf8"));
              content.expo = content.expo || {};
              content.expo.android = content.expo.android || {};
              content.expo.android.usesCleartextTraffic = true;
              fs.writeFileSync(path, JSON.stringify(content, null, 2));
              console.log("Cleartext agregado correctamente a app.json");
            }
          '

      - name: Dependencias
        working-directory: mitv
        run: |
          npm install
          npx expo install --fix

      - name: Generar Android
        working-directory: mitv
        run: npx expo prebuild --platform android --no-install

      - name: Compilar
        working-directory: mitv
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mitv/android/app/build/outputs/apk/release/app-release.apk
          
