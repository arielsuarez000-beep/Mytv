name: Construir APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir
        run: |
          unzip -q mitv-app.zip
          rm -f mitv/babel.config.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Cleartext en app.json
        run: |
          node -e '
            const fs = require("fs");
            const file = "./mitv/app.json";
            if (fs.existsSync(file)) {
              const data = JSON.parse(fs.readFileSync(file, "utf8"));
              data.expo = data.expo || {};
              data.expo.android = data.expo.android || {};
              data.expo.android.usesCleartextTraffic = true;
              fs.writeFileSync(file, JSON.stringify(data, null, 2));
              console.log("app.json actualizado con usesCleartextTraffic: true");
            }
          '

      - name: Dependencias
        working-directory: mitv
        run: |
          npm install
          npx expo install --fix

      - name: Generar Android
        working-directory: mitv
        run: npx expo prebuild --platform android --no-install

      - name: Compilar
        working-directory: mitv
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: APK-${{ github.run_number }}
          name: MiTV build ${{ github.run_number }}
          files: mitv/android/app/build/outputs/apk/release/app-release.apk
