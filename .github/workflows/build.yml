name: Construir APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir
        run: |
          unzip -q mitv-app.zip
          rm -f mitv/babel.config.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependencias
        working-directory: mitv
        run: |
          npm install
          npx expo install --fix

      - name: Generar Android
        working-directory: mitv
        run: npx expo prebuild --platform android --no-install

      - name: Verificar HTTP y soporte para TV box
        working-directory: mitv
        run: node scripts/verify-manifest.js

      - name: Compilar
        working-directory: mitv
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Guardar APK en Actions
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mitv/android/app/build/outputs/apk/release/app-release.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: MiTV build ${{ github.run_number }}
          files: mitv/android/app/build/outputs/apk/release/app-release.apk
